plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode", "1").toInteger()
def flutterVersionName = localProperties.getProperty("flutter.versionName", "1.0.0")
def localPreviewDefine = 'PLANT_LAB_LOCAL_PREVIEW=true'.getBytes('UTF-8').encodeBase64().toString()
def localPreview = (project.findProperty('dart-defines') ?: '').toString().split(',').contains(localPreviewDefine)
def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('key.properties')
if (releasePropertiesFile.isFile()) {
    releasePropertiesFile.withReader('UTF-8') { releaseProperties.load(it) }
}
def releaseEnv = [
    storeFile: 'PLANT_LAB_RELEASE_STORE_FILE',
    storeType: 'PLANT_LAB_RELEASE_STORE_TYPE',
    storePassword: 'PLANT_LAB_RELEASE_STORE_PASSWORD',
    keyAlias: 'PLANT_LAB_RELEASE_KEY_ALIAS',
    keyPassword: 'PLANT_LAB_RELEASE_KEY_PASSWORD'
]
if (releaseEnv.values().any { System.getenv(it) != null }) {
    releaseProperties.clear()
    releaseEnv.each { property, variable ->
        def value = System.getenv(variable)
        if (value != null) releaseProperties.setProperty(property, value)
    }
}
def releaseStore = releaseProperties.getProperty('storeFile')
def releaseStoreFile = releaseStore?.trim() ? rootProject.file(releaseStore) : null
def releaseSigningReady = releaseStoreFile?.isFile() &&
    releaseStoreFile.name.toLowerCase(Locale.ROOT) != 'debug.keystore' &&
    ['storePassword', 'keyAlias', 'keyPassword'].every { releaseProperties.getProperty(it)?.trim() } &&
    !'androiddebugkey'.equalsIgnoreCase(releaseProperties.getProperty('keyAlias')?.trim())

gradle.taskGraph.whenReady { graph ->
    def buildsReleaseArtifact = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(?i)^(assemble|bundle|package|validateSigning).*release.*/
    }
    if (buildsReleaseArtifact && (localPreview || !releaseSigningReady)) {
        throw new GradleException(localPreview
            ? 'A local preview must not be packaged as a release.'
            : 'Release signing requires an approved non-debug keystore (local signing environment or android/key.properties).')
    }
}

android {
    namespace 'com.plantlab.plant_lab'
    compileSdkVersion 36

    flavorDimensions += "module"

    defaultConfig {
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode
        versionName flutterVersionName
    }

    productFlavors {
        plant {
            dimension "module"
            applicationId "com.advantaindonesia.plant"
        }
        lab {
            dimension "module"
            applicationId "com.advantaindonesia.lab"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile releaseStoreFile
                if (releaseProperties.getProperty('storeType')) {
                    storeType releaseProperties.getProperty('storeType')
                }
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            if (localPreview) {
                applicationIdSuffix ".preview"
            }
        }
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

flutter {
    source = "../.."
}
