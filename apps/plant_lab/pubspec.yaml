name: plant_lab
description: Plant & Lab Quality Management System — Advanta Seeds
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.9.1
  flutter_dotenv: ^6.0.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Offline / Local DB
  drift: ^2.23.1
  drift_flutter: ^0.2.4

  # Firebase Messaging
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5

  # Data Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  fl_chart: ^0.71.0
  shimmer: ^3.0.0
  gap: ^3.0.1

  # Forms & Validation
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^2.6.1

  # File & Image
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  dio: ^5.8.0+1

  # PDF & Export
  pdf: ^3.11.3
  printing: ^5.14.2

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1
  equatable: ^2.0.7
  logger: ^2.5.0
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  share_plus: ^10.1.4

  mobile_scanner: ^6.0.2
  package_info_plus: ^8.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.1
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  drift_dev: ^2.23.0

  # Linting
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo_plant_lab.png
    - assets/icon.png
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo_plant_lab.png"
  adaptive_icon_background: "#002855"
  adaptive_icon_foreground: "assets/logo_plant_lab.png"
